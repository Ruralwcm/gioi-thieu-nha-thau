<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Giới Thiệu Nhà Thầu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f5f5f5;color:#333;min-height:100vh;display:flex;flex-direction:column}

/* Header */
.header{background:linear-gradient(135deg,#C00000,#E8213D);color:#fff;padding:12px 16px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(192,0,0,.25)}
.header .logo{height:28px;margin-bottom:4px}
.header h1{font-size:16px;font-weight:700;margin-bottom:2px}
.header .sub{font-size:11px;opacity:.85}

/* Tabs */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e0e0e0;position:sticky;top:80px;z-index:99}
.tab{flex:1;text-align:center;padding:12px;font-size:14px;font-weight:600;cursor:pointer;color:#888;border-bottom:3px solid transparent;transition:all .2s;background:#fff}
.tab.active{color:#C00000;border-bottom-color:#C00000}
.tab:hover{color:#C00000}

/* Content */
.content{padding:16px;max-width:600px;margin:0 auto;width:100%;flex:1}
.panel{display:none}
.panel.active{display:block}

/* Form */
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px}
.card h3{font-size:14px;color:#C00000;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:4px;height:18px;background:#C00000;border-radius:2px;display:inline-block}

label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;margin-top:12px}
label:first-of-type{margin-top:0}

input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;transition:border .2s;font-family:inherit;background:#fafafa}
input:focus,select:focus,textarea:focus{outline:none;border-color:#C00000;background:#fff}
textarea{resize:vertical;min-height:70px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:#C00000;color:#fff;width:100%;margin-top:16px}
.btn-primary:hover{background:#a00000;transform:translateY(-1px)}
.btn-primary:disabled{background:#ccc;cursor:not-allowed;transform:none}
.btn-outline{border:1.5px solid #C00000;color:#C00000;background:#fff}
.btn-outline:hover{background:#fff5f5}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{background:#2e7d32}
.toast.error{background:#c62828}

/* GAS Config */
.config-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.config-row input{flex:1;min-width:200px}
.config-row .btn{padding:8px 16px;font-size:13px;margin-top:0}
.saved-url{font-size:11px;color:#888;margin-top:4px}

/* Tag */
.tag{display:inline-flex;align-items:center;gap:4px;background:#fff5f5;color:#C00000;border:1px solid #fcc;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:500}

/* Dashboard */
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-row select,.filter-row input{flex:1;min-width:120px;padding:8px 10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:8px;overflow:hidden}
th{background:#C00000;color:#fff;padding:10px 8px;text-align:left;font-weight:600;white-space:nowrap;font-size:12px}
td{padding:8px;border-bottom:1px solid #f0f0f0}
tr:hover{background:#fff5f5}
.tr-over .tag{background:#fff0f0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.stat-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center}
.stat-card .num{font-size:24px;font-weight:700;color:#C00000}
.stat-card .lbl{font-size:11px;color:#888;margin-top:2px}

.empty{text-align:center;padding:32px 16px;color:#aaa}
.empty .icon{font-size:48px;margin-bottom:8px}

/* Footer */
.footer{text-align:center;padding:12px;font-size:11px;color:#aaa;border-top:1px solid #eee;margin-top:auto}
.footer a{color:#C00000;text-decoration:none}

/* Overlay Dashboard */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#f5f5f5;z-index:200;overflow-y:auto;display:none;flex-direction:column}
.overlay.show{display:flex}
.overlay-header{background:linear-gradient(135deg,#C00000,#E8213D);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.overlay-header h2{font-size:16px;font-weight:700}
.ov-close{background:none;border:none;color:#fff;font-size:28px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ov-close:hover{background:rgba(255,255,255,.2)}
.overlay-body{flex:1;padding:16px;max-width:800px;margin:0 auto;width:100%}

@media(min-width:600px){.content{max-width:650px}}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <img class="logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 120'%3E%3Ctext x='200' y='85' font-family='Arial,sans-serif' font-size='90' font-weight='bold' fill='white' text-anchor='middle'%3EWinMart%2B%3C/text%3E%3C/svg%3E" alt="WinMart+">
  <h1>📋 Giới Thiệu Nhà Thầu</h1>
  <div class="sub">Khai báo &amp; quản lý nhà thầu địa phương</div>
</div>

<!-- Tabs -->
<div class="tabs">
  <div class="tab active" data-tab="khai-bao">✏️ Khai báo</div>
  <div class="tab" data-tab="dashboard">📊 Dashboard</div>
</div>

<!-- Content -->
<div class="content">

  <!-- Khai báo -->
  <div class="panel active" id="panel-khai-bao">
    <div class="card">
      <h3>Cấu hình GAS</h3>
      <div class="config-row">
        <input type="text" id="gasUrl" placeholder="Dán GAS Web App URL vào đây...">
        <button class="btn btn-outline" onclick="saveGasUrl()">💾 Lưu</button>
      </div>
      <div class="saved-url" id="savedUrlHint"></div>
    </div>

    <div class="card">
      <h3>Thông tin Nhà Thầu</h3>
      
      <label>Hạng mục <span style="color:#C00000">*</span></label>
      <select id="hangMuc" required>
        <option value="">— Chọn hạng mục —</option>
        <option value="Cơ khí">Cơ khí</option>
        <option value="Cửa cuốn, kính">Cửa cuốn, kính</option>
        <option value="Điện, nước công trình">Điện, nước công trình</option>
        <option value="Nội thất">Nội thất</option>
        <option value="Quảng cáo, biển bảng">Quảng cáo, biển bảng</option>
        <option value="Sơn, chống thấm">Sơn, chống thấm</option>
        <option value="Thi công trọn gói">Thi công trọn gói</option>
        <option value="Thuê lều/bạt">Thuê lều / bạt</option>
        <option value="Vận tải">Vận tải</option>
      </select>

      <label>Tên CTY / Nhà Thầu <span style="color:#C00000">*</span></label>
      <input type="text" id="tenCty" placeholder="Nhập tên công ty hoặc nhà thầu">

      <label>Người đại diện <span style="color:#C00000">*</span></label>
      <input type="text" id="nguoiDaiDien" placeholder="Họ tên người đại diện">

      <label>Số điện thoại <span style="color:#C00000">*</span></label>
      <input type="tel" id="sdt" placeholder="VD: 0912345678">

      <label>Khu vực / Tỉnh Thành <span style="color:#C00000">*</span></label>
      <input type="text" id="tinhThanh" placeholder="VD: TP. Hồ Chí Minh, Hà Nội...">

      <label>Phường / Xã hiện tại</label>
      <input type="text" id="phuongXa" placeholder="Phường/xã nơi nhà thầu đang hoạt động">
    </div>

    <button class="btn btn-primary" onclick="submitForm()" id="btnSubmit">
      ✅ Gửi thông tin Nhà Thầu
    </button>

    <p style="margin-top:12px;text-align:center;">
      <a href="#" onclick="openDashboard()" style="color:#C00000;text-decoration:none;font-size:13px">📊 Xem Dashboard Nhà Thầu</a>
    </p>
  </div>

  <!-- Dashboard -->
  <div class="panel" id="panel-dashboard">
    <div class="stats" id="statsContainer"></div>
    <div class="filter-row">
      <select id="filterHangMuc" onchange="loadDashboard()">
        <option value="">Tất cả hạng mục</option>
      </select>
      <input type="text" id="filterSearch" placeholder="🔍 Tìm kiếm..." oninput="loadDashboard()">
      <button class="btn btn-outline" onclick="exportCSV()" style="font-size:12px">📥 CSV</button>
    </div>
    <div class="table-wrap" id="tableContainer">
      <div class="empty"><div class="icon">📭</div><p>Chưa có dữ liệu</p></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Footer -->
<div class="footer">
  WinMart+ Rural · App Giới Thiệu Nhà Thầu · v1.0
</div>

<script>
const APP_DATA_KEY = 'gioi-thieu-nha-thau-config';
const HANG_MUC_LIST = [
  'Cơ khí','Cửa cuốn, kính','Điện, nước công trình','Nội thất',
  'Quảng cáo, biển bảng','Sơn, chống thấm','Thi công trọn gói',
  'Thuê lều/bạt','Vận tải'
];

// ========== TABS ==========
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    document.getElementById('panel-' + t.dataset.tab).classList.add('active');
    if (t.dataset.tab === 'dashboard') loadDashboard();
  });
});

// ========== CONFIG ==========
function getConfig() {
  try { return JSON.parse(localStorage.getItem(APP_DATA_KEY) || '{}'); }
  catch(e) { return {}; }
}
function setConfig(cfg) { localStorage.setItem(APP_DATA_KEY, JSON.stringify(cfg)); }

function loadConfig() {
  const cfg = getConfig();
  if (cfg.gasUrl) {
    document.getElementById('gasUrl').value = cfg.gasUrl;
    document.getElementById('savedUrlHint').textContent = '✅ Đã lưu GAS URL';
  }
  // Init filter dropdown
  const sel = document.getElementById('filterHangMuc');
  HANG_MUC_LIST.forEach(h => { const o = document.createElement('option'); o.value = h; o.textContent = h; sel.appendChild(o); });
}

function saveGasUrl() {
  const url = document.getElementById('gasUrl').value.trim();
  if (!url) return showToast('⚠️ Vui lòng nhập GAS URL', 'error');
  const cfg = getConfig();
  cfg.gasUrl = url;
  setConfig(cfg);
  document.getElementById('savedUrlHint').textContent = '✅ Đã lưu GAS URL';
  showToast('✅ Đã lưu GAS URL', 'success');
}

// ========== SUBMIT ==========
async function submitForm() {
  const cfg = getConfig();
  if (!cfg.gasUrl) return showToast('⚠️ Vui lòng cấu hình GAS URL trước', 'error');

  const hangMuc = document.getElementById('hangMuc').value.trim();
  const tenCty = document.getElementById('tenCty').value.trim();
  const nguoiDaiDien = document.getElementById('nguoiDaiDien').value.trim();
  const sdt = document.getElementById('sdt').value.trim();
  const tinhThanh = document.getElementById('tinhThanh').value.trim();
  const phuongXa = document.getElementById('phuongXa').value.trim();

  if (!hangMuc) return showToast('⚠️ Vui lòng chọn hạng mục', 'error');
  if (!tenCty) return showToast('⚠️ Vui lòng nhập tên CTY/Nhà Thầu', 'error');
  if (!nguoiDaiDien) return showToast('⚠️ Vui lòng nhập người đại diện', 'error');
  if (!sdt) return showToast('⚠️ Vui lòng nhập SĐT', 'error');
  if (!tinhThanh) return showToast('⚠️ Vui lòng nhập Khu vực/Tỉnh Thành', 'error');

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = '⏳ Đang gửi...';

  try {
    const resp = await fetch(cfg.gasUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'save',
        data: { hangMuc, tenCty, nguoiDaiDien, sdt, tinhThanh, phuongXa }
      })
    });
    const result = await resp.json();
    if (result.success) {
      showToast('✅ Đã lưu thông tin Nhà Thầu!', 'success');
      clearForm();
    } else {
      showToast('❌ Lỗi: ' + (result.error || 'Không rõ'), 'error');
    }
  } catch (err) {
    showToast('❌ Lỗi kết nối: ' + err.message, 'error');
  }

  btn.disabled = false;
  btn.textContent = '✅ Gửi thông tin Nhà Thầu';
}

function clearForm() {
  document.getElementById('hangMuc').value = '';
  document.getElementById('tenCty').value = '';
  document.getElementById('nguoiDaiDien').value = '';
  document.getElementById('sdt').value = '';
  document.getElementById('tinhThanh').value = '';
  document.getElementById('phuongXa').value = '';
}

// ========== DASHBOARD ==========
async function loadDashboard() {
  const cfg = getConfig();
  if (!cfg.gasUrl) {
    document.getElementById('tableContainer').innerHTML = '<div class="empty"><div class="icon">⚙️</div><p>Vui lòng cấu hình GAS URL ở tab Khai báo</p></div>';
    document.getElementById('statsContainer').innerHTML = '';
    return;
  }

  try {
    const resp = await fetch(cfg.gasUrl + '?action=list');
    const result = await resp.json();
    const allData = result.data || [];

    const filterHM = document.getElementById('filterHangMuc').value;
    const filterQ = document.getElementById('filterSearch').value.toLowerCase();

    let data = allData;
    if (filterHM) data = data.filter(r => r.hangMuc === filterHM);
    if (filterQ) data = data.filter(r => 
      (r.tenCty || '').toLowerCase().includes(filterQ) ||
      (r.nguoiDaiDien || '').toLowerCase().includes(filterQ) ||
      (r.sdt || '').includes(filterQ) ||
      (r.tinhThanh || '').toLowerCase().includes(filterQ) ||
      (r.phuongXa || '').toLowerCase().includes(filterQ)
    );

    // Stats
    const statsHtml = [];
    statsHtml.push(`<div class="stat-card"><div class="num">${allData.length}</div><div class="lbl">Tổng Nhà Thầu</div></div>`);
    const hmCounts = {};
    allData.forEach(r => { hmCounts[r.hangMuc] = (hmCounts[r.hangMuc] || 0) + 1; });
    const topHM = Object.entries(hmCounts).sort((a,b) => b[1]-a[1]).slice(0,3);
    topHM.forEach(([hm, n]) => statsHtml.push(`<div class="stat-card"><div class="num">${n}</div><div class="lbl">${hm}</div></div>`));
    document.getElementById('statsContainer').innerHTML = statsHtml.join('');

    // Table
    if (data.length === 0) {
      document.getElementById('tableContainer').innerHTML = '<div class="empty"><div class="icon">📭</div><p>Không tìm thấy dữ liệu</p></div>';
    } else {
      let html = '<table><thead><tr><th>Hạng mục</th><th>Tên CTY</th><th>Người ĐD</th><th>SĐT</th><th>Tỉnh/Thành</th><th>Phường/Xã</th><th>Thời gian</th></tr></thead><tbody>';
      data.forEach(r => {
        html += `<tr>
          <td><span class="tag">${esc(r.hangMuc)}</span></td>
          <td><strong>${esc(r.tenCty)}</strong></td>
          <td>${esc(r.nguoiDaiDien)}</td>
          <td>${esc(r.sdt)}</td>
          <td>${esc(r.tinhThanh)}</td>
          <td>${esc(r.phuongXa || '—')}</td>
          <td style="font-size:11px;color:#888">${fmtDate(r.created_at)}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      document.getElementById('tableContainer').innerHTML = html;
    }
  } catch (err) {
    document.getElementById('tableContainer').innerHTML = `<div class="empty"><div class="icon">❌</div><p>Lỗi tải dữ liệu: ${esc(err.message)}</p></div>`;
    document.getElementById('statsContainer').innerHTML = '';
  }
}

function exportCSV() {
  const table = document.querySelector('#tableContainer table');
  if (!table) return showToast('⚠️ Không có dữ liệu để xuất', 'error');
  let csv = '\uFEFF';
  table.querySelectorAll('tr').forEach(row => {
    const cols = [];
    row.querySelectorAll('th,td').forEach(cell => cols.push('"' + (cell.textContent || '').replace(/"/g,'""') + '"'));
    csv += cols.join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Nha_Thau_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function openDashboard() {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelector('.tab[data-tab="dashboard"]').classList.add('active');
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  document.getElementById('panel-dashboard').classList.add('active');
  loadDashboard();
}

// ========== HELPERS ==========
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d) { if (!d) return '—'; try { return new Date(d).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e) { return String(d).slice(0,16); } }

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '') + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Init
loadConfig();
</script>
</body>
</html>
